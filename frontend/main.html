<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="main.css">
  <title>PEASY Clone</title>
  <style>

  </style>
</head>

<body>

  <div class="mobile-container">
    <!-- Header -->
    <header>
      <div class="logo">
        <img src="src/assets/logo.svg" alt="Логотип" class="logo-svg">
      </div>
      <a href="#">
        <img src="src/assets/profile.svg" alt="профиль" class="profile-icon">
      </a>
    </header>

    <!-- Search Bar -->
    <div class="search-section">
      <input type="text" class="search-input" placeholder="Введите адрес">
      <div class="glass-round">
        <img src="src/assets/settings.svg" alt="Настройки" class="icon-btn">
      </div>
      <div class="glass-round">
        <img src="src/assets/search.svg" alt="Поиск" class="icon-btn">
      </div>
    </div>

    <!-- Content -->
    <div class="content-grid">
      <div class="info-box">
        <div class="info-item">
          <div class="info-label">Адрес</div>
          <div class="address-card">
            ул. Каролинского,14/1,<br>г.Сургут,
          </div>
        </div>
        <div class="info-item">
          <div class="info-label">Всего свободных мест</div>
          <div class="count-card">
            <div class="count-number">18</div>
          </div>
        </div>
      </div>

      <div class="categories-list">
        <div class="category-item"><span>категория A</span><span>18</span></div>
        <div class="category-item"><span>категория B</span><span>18</span></div>
        <div class="category-item"><span>категория C</span><span>18</span></div>
        <div class="category-item"><span>категория D</span><span>18</span></div>
        <div class="category-item"><span>PICKUP</span><span>18</span></div>
      </div>
    </div>
    <img src="src/assets/car-footer.svg" alt="Машина" class="car-footer">
    <footer class="footer">
      <div class="footer-logo">
        <img src="src/assets/logo.svg" alt="Логотип" class="footer-vct">
      </div>
      <p class="footer-text">©ПИКИКИ, все права защищены. 2026</p>
    </footer>
  </div>

</body>

</html>
