<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="registration.css">
    <title>PEASY Clone</title>
    <style>

    </style>
</head>

<body>

    <div class="mobile-container">
        <!-- Header -->
        <header>
            <div class="logo">
                <img src="src/assets/logo.svg" alt="Логотип" class="logo-svg">
            </div>
        </header>
        
        <form action="#" method="POST" class="reg">
                <h2 class="registration-title">Регистрация</h2>
                <div class="form-group">
                    <input type="text" class="form-input" placeholder="Введите имя">
                </div>

                <div class="form-group">
                    <input type="text" class="form-input" placeholder="Введите адрес">
                </div>

                <div class="form-group">
                    <input type="password" class="form-input" placeholder="Введите пароль">
                </div>

                <button type="submit" class="submit-btn">Войти</button>
            </form>
        <footer class="footer">
            <div class="footer-logo">
                <img src="src/assets/logo.svg" alt="Логотип" class="footer-vct">
            </div>
            <p class="footer-text">©ПИКИКИ, все права защищены. 2026</p>
        </footer>
    </div>

</body>

</html>
