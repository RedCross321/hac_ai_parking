<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>frontend</title>
  <style>
    @font-face {
      font-family: 'MyFont';
      src: url('FileName.eot');
      src: url('FileName.eot?#iefix') format('embedded-opentype'),
        url('FileName.woff') format('woff'),
        url('FileName.ttf') format('truetype'),
        url('FileName.svg#FontName') format('svg');
      font-style: normal;
      font-weight: normal;
    }

    body {
      font-family: 'MyFont', Arial, sans-serif;
      background-color: #FFFFFF;
      margin: 0;
    }

    .header {
      display: flex;

    }

    .container {
      max-width: 400px;
      margin: 0 auto;
    }

    .title-site {
      text-align: center;
      text-transform: uppercase;
      color: #1F7A8C;
      font-size: 3rem;
    }

    .search {
      display: flex;
      width: auto;
      gap: 15px;
    }

    .input-search {
      width: 280px;
      height: 50px;
      border: none;
      border-radius: 25px;
      background-color: #C0DBF8;
      box-shadow: 0 2px 7px 1px #032A37;
      padding-left: 20px;
      outline: none;
      -webkit-backdrop-filter: blur(5px);
      backdrop-filter: blur(5px);
    }

    .input-search::placeholder {
      color: #012B39;
      font-size: 1.1rem;
    }

    .search-btn {
      width: 60px;
      border: none;
      border-radius: 20px;
      background-color: #C0DBF8;
      box-shadow: 0 2px 7px 1px #032A37;
      font-size: 2.5rem;
    }

    .main {
      margin-top: 20px;
    }

    .all-info {
      background-color: #FFFFFF;
      opacity: 0.8;
      border: 3px solid #012B39;
      border-radius: 20px;
      padding: 10px;
      margin-top: 80px;
      min-height: 300px;
      font-size: 1.5rem;
      color: #012B39;
    }

    span {
      color: #1F7A8C;
    }

    .profile-btn {
      margin: 90px auto;
      background-color: #012B39;
      padding: 20px 30px;
      border-radius: 50px;
      width: 100px;
      opacity: 0.8;
    }

    .profile-link {
      font-size: 1.5rem;
      text-decoration: none;
      color: #FFFFFF;
    }

    .back {
      position: absolute;
      width: 430px;
      z-index: -1;
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="container">
      <h1 class="title-site">peasy</h1>
      <from class="search">
        <input class="input-search" placeholder="Адрес или ссылка" type="text" name="" id="">
        <button class="search-btn">⌕</button>
      </from>
    </div>
  </header>
  <img src="./src/assets/Background-img.png" alt="Задний фон" class="back">
  <main class="main">
    <div class="container">
      <div class="all-info">
        <h3 class="quantity-free">
          Свободные места: <span>17</span>
        </h3>
        <p class="distance">
          Расстояние: <span>374м</span>
        </p>
      </div>
      <div class="profile-btn">
        <a href="#" class="profile-link">Профиль</a>
      </div>
    </div>
  </main>
  <!-- <script type="module" src="/src/main.jsx"></script> -->
</body>

</html>
